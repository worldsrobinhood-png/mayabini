<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Hind Siliguri", sans-serif;
    color: #554653;
    overflow-x: hidden;

        radial-gradient(
            circle at 15% 15%,

            circle at 85% 80%,
            #e8e0ff,
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #fff9fc,
            #faf7ff
        );
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.bg span {
    position: absolute;
    font-size: 25px;
    opacity: .25;
    animation: float 7s ease-in-out infinite;
}

.bg span:nth-child(1) {
    left: 8%;
    top: 12%;
}

.bg span:nth-child(2) {
    right: 10%;
    top: 20%;
    animation-delay: 1.5s;
}

.bg span:nth-child(3) {
    left: 12%;
    bottom: 15%;
    animation-delay: 3s;
}

.bg span:nth-child(4) {
    right: 15%;
    bottom: 12%;
    animation-delay: 4s;
}

@keyframes float {

    50% {
        transform:
            translateY(-20px)
            rotate(8deg);
    }
}


/* =====================================================
   PAGE
===================================================== */

.page {
    position: relative;
    z-index: 1;

    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;
}


/* =====================================================
   CARD
===================================================== */

.card {
    width: min(720px, 100%);

    min-height: 680px;
    max-height: calc(100vh - 30px);

    padding: 40px 35px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.84);

    border:
        1px solid
        rgba(255,255,255,.95);

    box-shadow:
        0 25px 70px
        rgba(80,55,80,.15);

    backdrop-filter: blur(15px);

    display: block;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-behavior: auto;

    position: relative;

    -webkit-overflow-scrolling: touch;
}


/* =====================================================
   SLIDE
===================================================== */

.slide {
    width: 100%;

    min-height: auto;

    text-align: center;

    padding-top: 20px;
    padding-bottom: 30px;

    animation:
        appear .5s ease;

    flex-shrink: 0;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   TITLE
===================================================== */

.title {
    font-family:
        "Atma",
        "Hind Siliguri",
        sans-serif;

    font-size:
        clamp(29px, 5vw, 38px);

    line-height: 1.4;

    font-weight: 600;

    color: #704d68;

    margin:
        0 auto 22px;

    max-width: 620px;
}


/* =====================================================
   TEXT
===================================================== */

    font-family:
        "Hind Siliguri",
        sans-serif;

    font-size:
        clamp(17px, 3vw, 20px);

    line-height: 1.9;

    white-space: pre-line;

    max-width: 620px;

    margin: auto;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {
    margin-top: 30px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 15px;

    flex-wrap: wrap;
}

button {
    border: 0;

    border-radius: 50px;

    padding:
        13px 24px;

    min-height: 50px;
    min-width: 125px;

    font-family:
        "Hind Siliguri",
        sans-serif;

    font-size: 17px;
    font-weight: 600;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    transition:
        transform .2s ease;
}

button:active {
    transform: scale(.95);
}


/* =====================================================
   YES BUTTON
===================================================== */

.yes {
    color: white;

    background:
        linear-gradient(
            135deg,
            #a86791,
            #8066b0
        );

    box-shadow:
        0 10px 25px
        rgba(120,80,150,.25);
}


/* =====================================================
   NO BUTTON
===================================================== */

.no {
    color: #635361;
    background: #eee6ed;
}


/* =====================================================
   OPENING EMOJI
===================================================== */

.openEmoji {
    height: 130px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 68px;

    margin-top: 15px;
}

.emojiShow {
    animation:
        emoji .65s ease;
}

@keyframes emoji {

    from {
        opacity: 0;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   WHATSAPP CHAT BUTTON AREA
===================================================== */

.chat-box {
    width: 100%;
    max-width: 520px;

    margin: 30px auto 0;

    padding: 25px 20px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.65);

    border:
        1px solid
        rgba(170,140,170,.15);
}

.chat-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.chat-button {
    margin-top: 10px;
}


/* =====================================================
   FINAL RUNNING NO AREA
===================================================== */

.run-area {
    position: relative;

    width: 100%;
    max-width: 500px;

    height: 250px;

    margin:
        25px auto 0;

    overflow: hidden;

    border-radius: 20px;
}


/* YES stays normally */

.final-yes {
    position: absolute;

    left: 50%;
    top: 30%;

    transform:
        translate(-50%, -50%);
}


/* NO runs away */

.run-no {
    position: absolute;

    left: 50%;
    top: 70%;

    transform:
        translate(-50%, -50%);

    transition:
        left .16s ease,
        top .16s ease;

/* =====================================================
   VARIABLES
===================================================== */

let currentSlide = 0;

let timer = null;



/* =====================================================
   SCROLL TO TOP

   Fixes the clipped title problem.
===================================================== */

function scrollToTop() {

    const card =
        document.getElementById("card");


    window.scrollTo({
        top: 0,
        left: 0,
        behavior: "auto"
    });


    if (card) {

        card.scrollTop = 0;
        card.scrollLeft = 0;

    }


    requestAnimationFrame(() => {

        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });


        if (card) {

            card.scrollTop = 0;
            card.scrollLeft = 0;

        }


        requestAnimationFrame(() => {

            window.scrollTo({
                top: 0,
                left: 0,
                behavior: "auto"
            });


            if (card) {

                card.scrollTop = 0;
                card.scrollLeft = 0;

            }

        });

    });


    setTimeout(() => {

        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });


        if (card) {

            card.scrollTop = 0;
            card.scrollLeft = 0;

        }

    }, 50);

}



/* =====================================================
   CLEAR TIMER
===================================================== */

function clearSlideTimer() {

    if (timer) {

        clearTimeout(timer);

        timer = null;

    }

}



/* =====================================================
   OPENING SCREEN

   15 seconds total
===================================================== */

function showOpening() {

    clearSlideTimer();


    const card =
        document.getElementById("card");


    card.innerHTML = `

        <div class="slide">

            <h1 class="title">
                হ্যালো… ✨
            </h1>

            <p class="text">
    হ্যালো… ✨
    <br><br>
    আমি সমীর…
    <br>
    তোমার জন্য একটা message আছে… 🌸
</p>

            <div
                id="openingEmoji"
                class="openEmoji">
            </div>

        </div>

    `;


    scrollToTop();


    const emojiBox =
        document.getElementById(
            "openingEmoji"
        );


    const emojis = [

        "🤔",
        "🧐",
        "👀",
        "🫣",
        "😳",
        "🥹",
        "😌",
        "🌸",
        "✨",
        "🫶🏻",
        "🌙"

    ];


    let i = 0;


    /*
       First 4 seconds are normal.

       Emoji starts after 4 seconds.
    */

    setTimeout(() => {

        const emojiTimer =
            setInterval(() => {

                if (
                    i >= emojis.length
                ) {

                    clearInterval(
                        emojiTimer
                    );

                    return;

                }


                emojiBox.textContent =
                    emojis[i];


                emojiBox.classList.remove(
                    "emojiShow"
                );


                void emojiBox.offsetWidth;


                emojiBox.classList.add(
                    "emojiShow"
                );


                i++;

            }, 1000);

    }, 4000);


    /*
       15 seconds -> Slide 2
    */

    timer =
        setTimeout(() => {

            currentSlide = 0;

            showSlide();

        }, 15000);

}



/* =====================================================
   SHOW SLIDE
===================================================== */

function showSlide() {

    clearSlideTimer();


    const slide =
        slides[currentSlide];


    const card =
        document.getElementById("card");


    card.innerHTML = `

        <div class="slide">

            <h1 class="title">
                ${slide.title}
            </h1>

            <p class="text">
                ${slide.text}
            </p>

            <div class="buttons">

                <button
                    id="yesButton"
                    class="yes">

                    ${slide.yes}

                </button>

                ${
                    slide.no
                    ?
                    `
                    <button
                        id="noButton"
                        class="no">

                        ${slide.no}

                    </button>
                    `
                    :
                    ""
                }

            </div>

        </div>

    `;


    /*
       Reset scroll AFTER inserting slide.
    */

    scrollToTop();


    const yesButton =
        document.getElementById(
            "yesButton"
        );


    if (yesButton) {

        yesButton.addEventListener(
            "click",
            handleYes
        );

    }


    const noButton =
        document.getElementById(
            "noButton"
        );


    if (noButton) {

        noButton.addEventListener(
            "click",
            handleNo
        );

    }


    /*
       Slide 2 = 55 seconds.
    */

    if (slide.auto) {

        const delay =
            slide.autoDelay || 15000;


        timer =
            setTimeout(() => {

                currentSlide++;

                showSlide();

            }, delay);

    }

}



/* =====================================================
   YES BUTTON

   ANY YES -> WhatsApp chat

   Exception:
   Slide 2 YES -> Slide 3
   Slide 3 YES -> Slide 4
===================================================== */

function handleYes() {

    /*
       Slide 2
    */

    if (currentSlide === 0) {

        currentSlide = 1;

        showSlide();

        return;

    }


    /*
       Slide 3
    */

    if (currentSlide === 1) {

        currentSlide = 2;

        showSlide();

        return;

    }


    /*
       Slide 4 onward:

       YES -> WhatsApp
    */

    showWhatsAppScreen();

}



/* =====================================================
   NO BUTTON
===================================================== */

function handleNo() {

    currentSlide++;


    if (
        currentSlide <
        slides.length
    ) {

        showSlide();

    }

    else {

        showFinalNo();

    }

}

/* =====================================================
   FINAL NO SCREEN
===================================================== */

function showFinalNo() {

    clearSlideTimer();


    const card =
        document.getElementById(
            "card"
        );


    card.innerHTML = `

        <div class="slide">

            <h1 class="title">

                এতগুলো কথা বলার পরেও… 🥺😂

            </h1>


            <p class="text">

                সত্যিই NO?

                <br><br>

                তুমি কিন্তু খুব কঠিন! 😭

                <br><br>

                ঠিক আছে…
                শেষবারের মতো জিজ্ঞেস করছি—

                <br><br>

                পরিচিত হবে? 🫣

            </p>


            <div
                class="run-area"
                id="runArea">


                <button
                    class="yes final-yes"
                    id="finalYes">

                    হ্যাঁ ✨

                </button>


                <button
                    class="no run-no"
                    id="runNo">

                    না 🙈

                </button>


            </div>

        </div>

    `;


    scrollToTop();


    /*
       FINAL YES
       -> WhatsApp screen
    */

    document
        .getElementById(
            "finalYes"
        )
        .addEventListener(
            "click",
            showWhatsAppScreen
        );


    const no =
        document.getElementById(
            "runNo"
        );


    const area =
        document.getElementById(
            "runArea"
        );



    /* =================================================
       MOVE NO BUTTON
    ================================================= */

    function moveNo(event) {

        if (event) {

            event.preventDefault();

        }


        const areaWidth =
            area.clientWidth;


        const areaHeight =
            area.clientHeight;


        const buttonWidth =
            no.offsetWidth;


        const buttonHeight =
            no.offsetHeight;


        /*
           Keep the NO button completely
           inside the visible box.
        */

        const maxX =
            Math.max(
                5,
                areaWidth -
                buttonWidth -
                5
            );


        const maxY =
            Math.max(
                5,
                areaHeight -
                buttonHeight -
                5
            );


        const x =
            5 +
            Math.random() *
            Math.max(
                1,
                maxX - 5
            );


        const y =
            5 +
            Math.random() *
            Math.max(
                1,
                maxY - 5
            );


        no.style.left =
            x + "px";


        no.style.top =
            y + "px";


        no.style.transform =
            "none";

    }



    /*
       Desktop
    */

    no.addEventListener(
        "mouseenter",
        moveNo
    );


    /*
       Mobile
    */

    no.addEventListener(
        "touchstart",
        moveNo,
        {
            passive: false
        }
    );


    /*
       Pointer devices
    */

    no.addEventListener(
        "pointerdown",
        moveNo
    );


    /*
       Extra protection
    */

    no.addEventListener(
        "click",
        moveNo
    );

}
