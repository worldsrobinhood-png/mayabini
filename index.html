<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    scroll-behavior: auto;
}


/* =====================================================
   BODY
===================================================== */

body {

    font-family:
        "Hind Siliguri",
        sans-serif;

    color: #554653;

    overflow-x: hidden;

    background:

        radial-gradient(
            circle at 15% 15%,
            #ffe6f1,
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            #e8e0ff,
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #fff9fc,
            #faf7ff
        );
}


/* =====================================================
   BACKGROUND DECORATION
===================================================== */

.bg {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.bg span {

    position: absolute;

    font-size: 25px;

    opacity: .25;

    animation:
        float 7s ease-in-out infinite;
}

.bg span:nth-child(1) {
    left: 8%;
    top: 12%;
}

.bg span:nth-child(2) {
    right: 10%;
    top: 20%;

    animation-delay: 1.5s;
}

.bg span:nth-child(3) {
    left: 12%;
    bottom: 15%;

    animation-delay: 3s;
}

.bg span:nth-child(4) {
    right: 15%;
    bottom: 12%;

    animation-delay: 4s;
}


@keyframes float {

    50% {
        transform:
            translateY(-20px)
            rotate(8deg);
    }
}


/* =====================================================
   PAGE
===================================================== */

.page {

    position: relative;

    z-index: 1;

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 15px;
}


/* =====================================================
   MAIN CARD

   IMPORTANT:
   display:block is used so the browser does not
   vertically center the content and clip the title.
===================================================== */

.card {

    width: min(720px, 100%);

    min-height: 680px;

    max-height:
        calc(100vh - 30px);

    padding:
        40px 35px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.84);

    border:
        1px solid
        rgba(255,255,255,.95);

    box-shadow:
        0 25px 70px
        rgba(80,55,80,.15);

    backdrop-filter:
        blur(15px);

    display: block;

    overflow-y: auto;

    overflow-x: hidden;

    scroll-behavior: auto;

    position: relative;

    -webkit-overflow-scrolling:
        touch;
}


/* =====================================================
   SLIDE
===================================================== */

.slide {

    width: 100%;

    min-height: auto;

    text-align: center;

    padding-top: 20px;

    padding-bottom: 30px;

    animation:
        appear .5s ease;

    flex-shrink: 0;
}


@keyframes appear {

    from {
        opacity: 0;

        transform:
            translateY(15px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   TITLE

   Kept at similar size instead of making the title
   excessively large.
===================================================== */

.title {

    font-family:
        "Atma",
        "Hind Siliguri",
        sans-serif;

    font-size:
        clamp(29px, 5vw, 38px);

    line-height: 1.4;

    font-weight: 600;

    color: #704d68;

    margin:
        0 auto 22px;

    max-width: 620px;
}


/* =====================================================
   TEXT
===================================================== */

.text {

    font-family:
        "Hind Siliguri",
        sans-serif;

    font-size:
        clamp(17px, 3vw, 20px);

    line-height: 1.9;

    white-space: pre-line;

    max-width: 620px;

    margin: auto;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {

    margin-top: 30px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    flex-wrap: wrap;
}


button {

    border: 0;

    border-radius: 50px;

    padding:
        13px 24px;

    min-height: 50px;

    min-width: 125px;

    font-family:
        "Hind Siliguri",
        sans-serif;

    font-size: 17px;

    font-weight: 600;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;

    transition:
        transform .2s ease;
}


button:active {

    transform:
        scale(.95);
}


/* YES */

.yes {

    color: white;

    background:

        linear-gradient(
            135deg,
            #a86791,
            #8066b0
        );

    box-shadow:

        0 10px 25px
        rgba(120,80,150,.25);
}


/* NO */

.no {

    color: #635361;

    background: #eee6ed;
}


/* =====================================================
   OPENING EMOJI
===================================================== */

.openEmoji {

    height: 130px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 68px;

    margin-top: 15px;
}


.emojiShow {

    animation:
        emoji .65s ease;
}


@keyframes emoji {

    from {

        opacity: 0;

        transform:
            scale(.5);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =====================================================
   DATE / TIME PICKER
===================================================== */

.picker {

    width:
        min(420px, 100%);

    margin:
        30px auto 0;

    display: flex;

    flex-direction: column;

    gap: 18px;
}


.picker label {

    text-align: left;

    font-size: 17px;

    font-weight: 600;
}


.picker input {

    display: block;

    width: 100%;

    margin-top: 7px;

    padding: 13px;

    border-radius: 14px;

    border:
        1px solid
        #ded1dc;

    background: #fff;

    font-family:
        "Hind Siliguri",
        sans-serif;

    font-size: 17px;

    outline: none;
}


.picker input:focus {

    border-color: #9c7aaa;

    box-shadow:
        0 0 0 4px
        rgba(156,122,170,.12);
}


/* =====================================================
   TIME INFO
===================================================== */

.time-info {

    margin-top: 10px;

    font-size: 15px;

    opacity: .75;
}


/* =====================================================
   FINAL RUN AREA
===================================================== */

.run-area {

    position: relative;

    width: 100%;

    max-width: 500px;

    height: 250px;

    margin:
        25px auto 0;

    overflow: hidden;

    border-radius: 20px;
}


/* YES stays normal */

.final-yes {

    position: absolute;

    left: 50%;

    top: 30%;

    transform:
        translate(-50%, -50%);
}


/* NO runs */

.run-no {

    position: absolute;

    left: 50%;

    top: 70%;

    transform:
        translate(-50%, -50%);

    transition:
        left .16s ease,
        top .16s ease;
}

/* =====================================================
   VARIABLES
===================================================== */

let currentSlide = 0;

let timer = null;



/* =====================================================
   SCROLL TO TOP

   This fixes the problem shown in your screenshot.

   The scroll is reset:
   1. Immediately
   2. On the next browser frame
   3. Again after 50ms
===================================================== */

function scrollToTop() {

    const card =
        document.getElementById("card");


    /* Browser page */

    window.scrollTo({
        top: 0,
        left: 0,
        behavior: "auto"
    });


    /* Card */

    if (card) {

        card.scrollTop = 0;

        card.scrollLeft = 0;
    }


    /* After browser renders new slide */

    requestAnimationFrame(() => {

        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });


        if (card) {

            card.scrollTop = 0;

            card.scrollLeft = 0;
        }


        requestAnimationFrame(() => {

            window.scrollTo({
                top: 0,
                left: 0,
                behavior: "auto"
            });


            if (card) {

                card.scrollTop = 0;

                card.scrollLeft = 0;
            }

        });

    });


    /* Final protection */

    setTimeout(() => {

        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });


        if (card) {

            card.scrollTop = 0;

            card.scrollLeft = 0;
        }

    }, 50);

}



/* =====================================================
   CLEAR TIMER
===================================================== */

function clearSlideTimer() {

    if (timer) {

        clearTimeout(timer);

        timer = null;
    }
}



/* =====================================================
   OPENING SCREEN

   Total = 15 seconds
===================================================== */

function showOpening() {

    clearSlideTimer();


    const card =
        document.getElementById("card");


    card.innerHTML = `

        <div class="slide">

            <h1 class="title">
                হ্যালো… ✨!!!!
            </h1>

            <p class="text">
               i am samir; তোমার জন্য একটা message আছে…
            </p>

            <div
                id="openingEmoji"
                class="openEmoji">
            </div>

        </div>

    `;


    scrollToTop();


    const emojiBox =
        document.getElementById(
            "openingEmoji"
        );


    /*
       First 4 seconds:
       normal message
    */


    const emojis = [

        "🤔",
        "🧐",
        "👀",
        "🫣",
        "😳",
        "🥹",
        "😌",
        "🌸",
        "✨",
        "🫶🏻",
        "🌙"

    ];


    let i = 0;


    /*
       Start emoji animation after 4 seconds
    */

    setTimeout(() => {

        const emojiTimer =
            setInterval(() => {

                if (
                    i >= emojis.length
                ) {

                    clearInterval(
                        emojiTimer
                    );

                    return;
                }


                emojiBox.textContent =
                    emojis[i];


                emojiBox.classList.remove(
                    "emojiShow"
                );


                /*
                   Restart CSS animation
                */

                void emojiBox.offsetWidth;


                emojiBox.classList.add(
                    "emojiShow"
                );


                i++;

            }, 1000);

    }, 4000);


    /*
       After 15 seconds:
       open মায়াবিনী slide
    */

    timer =
        setTimeout(() => {

            currentSlide = 0;

            showSlide();

        }, 15000);

}



/* =====================================================
   SHOW SLIDE
===================================================== */

function showSlide() {

    clearSlideTimer();


    const slide =
        slides[currentSlide];


    const card =
        document.getElementById("card");


    card.innerHTML = `

        <div class="slide">

            <h1 class="title">
                ${slide.title}
            </h1>

            <p class="text">
                ${slide.text}
            </p>

            <div class="buttons">

                <button
                    id="yesButton"
                    class="yes">

                    ${slide.yes}

                </button>

                ${
                    slide.no
                    ?
                    `
                    <button
                        id="noButton"
                        class="no">

                        ${slide.no}

                    </button>
                    `
                    :
                    ""
                }

            </div>

        </div>

    `;


    /*
       VERY IMPORTANT

       Scroll to top AFTER new slide is inserted.
    */

    scrollToTop();


    /*
       YES
    */

    const yesButton =
        document.getElementById(
            "yesButton"
        );


    if (yesButton) {

        yesButton.addEventListener(
            "click",
            handleYes
        );

    }


    /*
       NO
    */

    const noButton =
        document.getElementById(
            "noButton"
        );


    if (noButton) {

        noButton.addEventListener(
            "click",
            handleNo
        );

    }


    /*
       Automatic slide

       Slide 2 uses 55 seconds.

       Other automatic slides can use
       15 seconds if auto=true.
    */

    if (slide.auto) {

        const delay =
            slide.autoDelay || 15000;


        timer =
            setTimeout(() => {

                currentSlide++;

                showSlide();

            }, delay);

    }

}



/* =====================================================
   YES BUTTON
===================================================== */

function handleYes() {


    /*
       মায়াবিনী slide
       -> সেই মায়া slide
    */

    if (currentSlide === 0) {

        currentSlide = 1;

        showSlide();

        return;
    }


    /*
       সেই মায়া slide
       -> পরিচিত হবে slide
    */

    if (currentSlide === 1) {

        currentSlide = 2;

        showSlide();

        return;
    }


    /*
       Any YES after that
       -> Date / Time picker
    */

    showDateTime();

}



/* =====================================================
   NO BUTTON
===================================================== */

function handleNo() {

    currentSlide++;


    if (
        currentSlide <
        slides.length
    ) {

        showSlide();

    }

    else {

        showFinalNo();

    }

}



/* =====================================================

===================================================== */

function getTodayString() {

    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}



/* =====================================================
   MAX DATE

   Today + 19 days

   Total selectable days = 20

   Example:
   September 1 -> September 20

===================================================== */

function getMaxDateString() {

    const maxDate =
        new Date();


    maxDate.setHours(
        0,
        0,
        0,
        0
    );


    maxDate.setDate(
        maxDate.getDate() + 19
    );


    const year =
        maxDate.getFullYear();


    const month =
        String(
            maxDate.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            maxDate.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}

/* =====================================================
   VALIDATE DATE
===================================================== */

function isValidDate(date) {

    if (!date) {

        return false;
    }


    const minimum =
        getTodayString();


    const maximum =
        getMaxDateString();


    return (
        date >= minimum &&
        date <= maximum
    );

}



/* =====================================================
   VALIDATE TIME
===================================================== */

function isValidTime(time) {

    if (!time) {

        return false;
    }


    const parts =
        time.split(":");


    if (
        parts.length < 2
    ) {

        return false;
    }


    const hour =
        Number(parts[0]);


    const minute =
        Number(parts[1]);


    if (
        Number.isNaN(hour) ||
        Number.isNaN(minute)
    ) {

        return false;
    }


    const totalMinutes =
        (hour * 60) +
        minute;


    const minimum =
        6 * 60;


    const maximum =
        23 * 60;


    return (
        totalMinutes >= minimum &&
        totalMinutes <= maximum
    );

}

/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    dateString
) {

    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        "bn-BD",
        {

            day:
                "numeric",

            month:
                "long",

            year:
                "numeric"

        }
    );

}



/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    timeString
) {

    const parts =
        timeString.split(":");


    let hour =
        Number(parts[0]);


    const minute =
        parts[1];


    let period;


    if (hour < 12) {

        period =
            "সকাল";

    }

    else if (hour === 12) {

        period =
            "দুপুর";

    }

    else if (hour < 18) {

        period =
            "বিকেল";

    }

    else {

        period =
            "রাত";

    }


    if (hour === 0) {

        hour = 12;

    }

    else if (hour > 12) {

        hour -= 12;

    }


    return (
        period +
        " " +
        hour +
        ":" +
        minute
    );

}

        );


    const area =
        document.getElementById(
            "runArea"
        );



    /* =================================================
       MOVE NO BUTTON
    ================================================= */

    function moveNo(event) {

        if (event) {

            event.preventDefault();
        }


        const areaWidth =
            area.clientWidth;


        const areaHeight =
            area.clientHeight;


        const buttonWidth =
            no.offsetWidth;


        const buttonHeight =
            no.offsetHeight;


        /*
           Keep button completely inside
           the visible area.
        */

        const maxX =
            Math.max(
                5,
                areaWidth -
                buttonWidth -
                5
            );


        const maxY =
            Math.max(
                5,
                areaHeight -
                buttonHeight -
                5
            );


        const x =
            5 +
            Math.random() *
            Math.max(
                1,
                maxX - 5
            );


        const y =
            5 +
            Math.random() *
            Math.max(
                1,
                maxY - 5
            );


        no.style.left =
            x + "px";


        no.style.top =
            y + "px";


        no.style.transform =
            "none";

    }



    /*
       Desktop:
       when mouse comes near the button
    */

    no.addEventListener(
        "mouseenter",
        moveNo
    );


    /*
       Mobile:
       when finger touches it
    */

    no.addEventListener(
        "touchstart",
        moveNo,
        {
            passive: false
        }
    );


    /*
       Modern mobile / desktop pointer
    */

    no.addEventListener(
        "pointerdown",
        moveNo
    );


    /*
       Extra protection
    */

    no.addEventListener(
        "click",
        moveNo
    );

}



/* =====================================================
   START WEBSITE
===================================================== */

showOpening();

</script>
